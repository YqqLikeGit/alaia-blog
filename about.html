    <p class="meta">说明</p>
    <div class="body">
      <p>「阿诺的小记」是个人维护的静态网页，用来存放日常随笔与生活记录。网站性质为<strong>个人非经营性</strong>，不展示商品与价目，不提供任何交易或支付入口，也不挂载广告与第三方营销链接。</p>
      <p>本站不收集访客账号，不设评论与注册功能。所有文字均为个人原创手记，仅供自己回顾与朋友随便看看。</p>
