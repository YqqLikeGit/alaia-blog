    <h1>周末去球场走了两小时</h1>
    <p class="meta">2026-10-12 · 运动</p>
    <div class="body">
      <p>周六上午阳光刚好，约了以前一起打球的朋友。到场地先慢跑热身，再对拉了几组正手和反手。</p>
      <p>今天刻意放慢节奏，只盯着脚下的步法。以前总急着发力，球经常出界；慢下来以后，落点稳了不少。中场休息时喝了自带的水，坐在场边吹风，感觉整个人都轻松了。</p>
      <p>收工前练了十分钟发球。抛球高度还不稳，不过连续进区的次数比上周多。回家路上决定把这些小进步记下来，方便下回对照。</p>
