    <h1>重读一本旧书的几句摘抄</h1>
    <p class="meta">2026-09-28 · 读书</p>
    <div class="body">
      <p>整理书架时翻到一本很多年前看过的小说。纸页已经有点发黄，书签还夹在原来的位置。</p>
      <p>这次没有从头到尾再读一遍，只挑了几章慢慢翻。有一句话写到「把寻常的日子过仔细」，突然觉得很适合现在的自己。于是抄在笔记本上，旁边画了个小圈。</p>
      <p>读书对我来说不是任务，更像是跟过去的自己打个招呼。以后有空还会把别的旧书拿出来晒晒太阳。</p>
