    <h1>傍晚绕湖走了一圈</h1>
    <p class="meta">2026-09-15 · 散步</p>
    <div class="body">
      <p>下班后不想直接回家，就去附近的湖边走了一圈。天色一点点暗下来，水面把云的颜色都收进去了。</p>
      <p>路上遇到好几个散步的人和遛狗的邻居，大家互相点头，也不多说话。风从对面吹过来，带着一点青草味。</p>
      <p>走完大概四十分钟，脚程不紧不慢。回到家先洗了个手，把今天看到的晚霞记在这里，算是给平凡的一天留个记号。</p>
