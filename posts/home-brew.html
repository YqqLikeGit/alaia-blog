    <h1>在家学做手冲的一点心得</h1>
    <p class="meta">2026-08-30 · 生活</p>
    <div class="body">
      <p>最近把家里的手冲壶又拿出来练。不为别的，就是觉得慢悠悠煮一杯东西很好玩，纯粹当兴趣。</p>
      <p>自己摸索下来，水温别太烫，研磨稍微粗一点，注水画圈要稳。失败了就倒掉重来，也没什么压力。杯子洗干净，桌面擦一擦，整个过程本身就挺解压。</p>
      <p>写这篇只是给以后的自己留个备忘：兴趣就好好玩，不必跟谁比较，也不必当成一份工作。</p>
